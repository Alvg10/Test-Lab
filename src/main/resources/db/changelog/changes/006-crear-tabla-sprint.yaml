databaseChangeLog:
  - changeSet:
      id: 006-crear-tabla-sprint
      author: mano
      changes:
        - createTable:
            tableName: sprint
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: nombre
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: proyecto_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: fecha_inicio
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: fecha_fin
                  type: DATE
        - addForeignKeyConstraint:
            baseTableName: sprint
            baseColumnNames: proyecto_id
            constraintName: fk_sprint_proyecto
            referencedTableName: proyecto
            referencedColumnNames: id
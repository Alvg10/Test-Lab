databaseChangeLog:
  - changeSet:
      id: 004-crear-tabla-proyecto
      author: mano
      changes:
        - createTable:
            tableName: proyecto
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: nombre
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: descripcion
                  type: VARCHAR(255)
              - column:
                  name: equipo_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: fecha_creacion
                  type: TIMESTAMP
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
              - column:
                  name: activo
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: proyecto
            baseColumnNames: equipo_id
            constraintName: fk_proyecto_equipo
            referencedTableName: equipo
            referencedColumnNames: id
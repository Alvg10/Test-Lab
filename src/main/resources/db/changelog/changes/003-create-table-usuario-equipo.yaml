databaseChangeLog:
  - changeSet:
      id: 003-create-table-usuario-equipo
      author: alvg

      changes:
        - createTable:
            tableName: usuario_equipo

            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: usuario_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: equipo_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: rol
                  type: VARCHAR(20)
                  constraints:
                    nullable: false

              - column:
                  name: fecha_ingreso
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: usuario_equipo
            baseColumnNames: usuario_id
            referencedTableName: usuario
            referencedColumnNames: id
            constraintName: fk_usuario_equipo_usuario

        - addForeignKeyConstraint:
            baseTableName: usuario_equipo
            baseColumnNames: equipo_id
            referencedTableName: equipo
            referencedColumnNames: id
            constraintName: fk_usuario_equipo_equipo

        - addUniqueConstraint:
            tableName: usuario_equipo
            columnNames: usuario_id,equipo_id
            constraintName: uk_usuario_equipo
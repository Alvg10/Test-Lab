services:
  postgres:
    image: postgres:17
    container_name: testlab-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: testlab
      POSTGRES_USER: testlab
      POSTGRES_PASSWORD: testlab123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: testlab-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: testlab@testlab.com
      PGADMIN_DEFAULT_PASSWORD: testlab123
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/pgadmin
    depends_on:
      - postgres

volumes:
  postgres_data:
  pgadmin_data: